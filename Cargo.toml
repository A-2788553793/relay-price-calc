[package]
name = "relay-price-calc"
version = "0.2.0"
edition = "2021"
description = "中转站计算工具：对比多个模型哪个更便宜"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
